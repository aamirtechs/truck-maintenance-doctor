[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "truck-maintenance-doctor"
version = "1.0.0"
description = "Audit a fleet maintenance schedule CSV for overdue and missing services"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
truck-maintenance-doctor = "truck_maintenance_doctor:main_entry"

[tool.setuptools]
py-modules = ["truck_maintenance_doctor"]
